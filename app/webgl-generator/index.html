<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGL 地图生成器</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel">
        <header class="panel-header">
          <h1>WebGL 地图生成器</h1>
          <p id="app-status">初始化中</p>
        </header>

        <section class="control-section">
          <h2>控制</h2>
          <button id="open-generation-panel" class="primary-action" type="button">控制面板</button>
        </section>

        <section class="control-section">
          <h2>运行时</h2>
          <dl id="runtime-stats" class="stats-list"></dl>
        </section>

        <section class="control-section">
          <h2>悬停</h2>
          <dl id="pick-stats" class="stats-list"></dl>
        </section>

        <section class="control-section">
          <h2>边界</h2>
          <dl class="stats-list">
            <div>
              <dt>正式应用</dt>
              <dd>app/webgl-generator</dd>
            </div>
            <div>
              <dt>快照 demo</dt>
              <dd>prototype/webgl-cells</dd>
            </div>
            <div>
              <dt>source</dt>
              <dd>只读参考</dd>
            </div>
          </dl>
        </section>
      </aside>

      <section class="map-stage" aria-label="地图画布">
        <canvas id="map-canvas"></canvas>
        <div class="map-overlay" id="map-overlay"></div>
        <div id="vue-state-root"></div>
        <div class="map-badge" id="map-badge">等待生成</div>
        <div class="map-legend" id="map-legend" hidden></div>
      </section>
    </main>

    <script>
      window.setTimeout(() => {
        if (window.__webglGeneratorApp) return;
        document.getElementById("app-status").textContent = "脚本尚未启动，请检查 DevTools 是否暂停或禁用 JavaScript";
        document.getElementById("map-badge").textContent = "脚本未启动";
      }, 3000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
