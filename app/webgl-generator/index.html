<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGL 地图生成器</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-stage" aria-label="地图画布">
        <canvas id="map-canvas"></canvas>
        <div class="map-overlay" id="map-overlay"></div>
        <div id="vue-state-root"></div>
        <div id="map-toolbar" class="map-toolbar" aria-label="地图工具"></div>
        <div class="map-badge" id="map-badge">等待生成</div>
        <div class="generation-loading-bubble" id="generation-loading" role="status" aria-live="polite" hidden>
          <span class="generation-loading-dot"></span>
          <span id="generation-loading-text">正在生成地图</span>
        </div>
        <div class="hover-overlay" id="hover-overlay" hidden></div>
        <div class="map-legend" id="map-legend" hidden></div>
        <div class="map-scale-bar" id="map-scale-bar" aria-label="地图比例尺" hidden>
          <div class="map-scale-line"></div>
          <div class="map-scale-label">比例尺</div>
        </div>
        <div class="measurement-overlay" id="measurement-overlay" hidden>
          <svg id="measurement-svg" class="measurement-svg" aria-hidden="true"></svg>
          <div id="measurement-readout" class="measurement-readout"></div>
        </div>
      </section>
    </main>

    <script>
      window.setTimeout(() => {
        if (window.__webglGeneratorApp) return;
        document.getElementById("map-badge").textContent = "脚本未启动";
        const status = document.getElementById("app-status");
        if (status) status.textContent = "脚本尚未启动，请检查 DevTools 是否暂停或禁用 JavaScript";
      }, 3000);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
