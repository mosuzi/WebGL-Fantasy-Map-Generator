<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>Dropbox 授权</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0f1519; color: #edf4f6; }
      main { width: min(28rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #33444f; border-radius: 0.75rem; background: #172127; box-sizing: border-box; }
      h1 { margin: 0 0 0.75rem; font-size: 1.25rem; }
      p { margin: 0; color: #b9c8cf; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <h1>Dropbox 授权</h1>
      <p id="status">正在返回地图页面…</p>
    </main>
    <script>
      (() => {
        const status = document.getElementById("status");
        const params = new URLSearchParams(location.search);
        const code = params.get("code") || "";
        const state = params.get("state") || "";
        const error = (params.get("error_description") || params.get("error") || "").slice(0, 240);
        if (!code && !error) {
          status.textContent = "没有收到 Dropbox 授权结果，请关闭此窗口后重新连接。";
          return;
        }
        if (!window.opener || window.opener === window) {
          status.textContent = "授权结果已返回，但原地图页面不可用。请关闭此窗口后重新连接。";
          return;
        }
        window.opener.postMessage({type: "fmg-cloud-oauth-callback", provider: "dropbox", code, state, error}, location.origin);
        status.textContent = "授权结果已返回地图页面，此窗口将自动关闭。";
        window.setTimeout(() => window.close(), 50);
      })();
    </script>
  </body>
</html>
