<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>交互审计浏览器夹具</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b1016;
        color: #e7edf5;
        font: 13px/1.5 system-ui, sans-serif;
      }

      #app-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #audit-result {
        position: fixed;
        inset: 8px;
        z-index: 2147483647;
        overflow: auto;
        margin: 0;
        padding: 12px;
        border: 1px solid #344255;
        border-radius: 8px;
        background: rgba(8, 13, 20, 0.97);
        white-space: pre-wrap;
      }

      #audit-result[data-status="running"] {
        max-width: 320px;
        max-height: 120px;
      }
    </style>
  </head>
  <body>
    <iframe id="app-frame" title="WebGL 地图生成器审计夹具"></iframe>
    <pre id="audit-result" data-status="running">正在初始化统一浏览器审计夹具……</pre>
    <script type="module" src="./interaction-browser-harness.js"></script>
  </body>
</html>
