<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FMG WebGL Cells Prototype</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel">
        <header>
          <h1>FMG WebGL 原型</h1>
          <p id="summary">正在加载地图快照...</p>
        </header>

        <section>
          <h2>专题面</h2>
          <div class="segmented thematic-modes" role="group" aria-label="专题面">
            <button class="active" type="button" data-mode="height">高度</button>
            <button type="button" data-mode="biomes">生物群系</button>
            <button type="button" data-mode="states">国家</button>
            <button type="button" data-mode="provinces">省份</button>
            <button type="button" data-mode="cultures">文化</button>
            <button type="button" data-mode="religions">宗教</button>
            <button type="button" data-mode="temperature">温度</button>
          </div>
        </section>

        <section>
          <h2>视图</h2>
          <div class="toolbar">
            <button type="button" id="fit-view">适配</button>
          </div>
        </section>

        <section>
          <h2>图层</h2>
          <label class="check-row">
            <input id="show-landmass" type="checkbox" checked />
            <span>陆地底色</span>
          </label>
          <label class="check-row">
            <input id="show-lakes" type="checkbox" checked />
            <span>湖泊</span>
          </label>
          <label class="check-row">
            <input id="show-coastline" type="checkbox" checked />
            <span>海岸/湖岸线</span>
          </label>
          <label class="check-row">
            <input id="show-state-borders" type="checkbox" checked />
            <span>国家边界</span>
          </label>
          <label class="check-row">
            <input id="show-province-borders" type="checkbox" checked />
            <span>省份边界</span>
          </label>
          <label class="check-row">
            <input id="show-routes" type="checkbox" checked />
            <span>路线</span>
          </label>
          <label class="check-row">
            <input id="show-rivers" type="checkbox" checked />
            <span>河流</span>
          </label>
          <label class="check-row">
            <input id="show-precipitation" type="checkbox" />
            <span>降水点</span>
          </label>
          <label class="check-row">
            <input id="show-population" type="checkbox" />
            <span>人口点</span>
          </label>
          <label class="check-row">
            <input id="show-burg-icons" type="checkbox" checked />
            <span>城市/港口</span>
          </label>
          <label class="check-row">
            <input id="show-markers" type="checkbox" checked />
            <span>标记</span>
          </label>
          <label class="check-row">
            <input id="show-burg-labels" type="checkbox" checked />
            <span>城市标签</span>
          </label>
          <label class="check-row">
            <input id="show-state-labels" type="checkbox" checked />
            <span>国家标签占位</span>
          </label>
          <label class="check-row">
            <input id="show-emblems" type="checkbox" />
            <span>纹章占位（暂关）</span>
          </label>
        </section>

        <section>
          <h2>编辑器原型</h2>
          <div class="segmented editor-tools" role="group" aria-label="编辑器工具">
            <button class="active" type="button" data-editor-tool="view">浏览</button>
            <button type="button" data-editor-tool="height">高度</button>
            <button type="button" data-editor-tool="river">河流</button>
            <button type="button" data-editor-tool="state">国家</button>
          </div>

          <div id="height-editor-panel" class="editor-panel" hidden>
            <div class="segmented editor-actions" role="group" aria-label="高度编辑方式">
              <button class="active" type="button" data-height-action="raise">抬高</button>
              <button type="button" data-height-action="lower">降低</button>
              <button type="button" data-height-action="smooth">平滑</button>
            </div>
            <label class="range-row">
              <span>半径</span>
              <input id="height-radius" type="range" min="4" max="48" value="18" />
            </label>
            <label class="range-row">
              <span>强度</span>
              <input id="height-strength" type="range" min="1" max="8" value="3" />
            </label>
          </div>

          <div id="river-editor-panel" class="editor-panel" hidden>
            <label class="field-row">
              <span>动作</span>
              <select id="river-action">
                <option value="width">改宽</option>
                <option value="move">拖点</option>
              </select>
            </label>
            <label class="range-row">
              <span>宽度</span>
              <input id="river-width" type="range" min="-0.25" max="0.25" step="0.05" value="0.1" />
            </label>
          </div>

          <div id="state-editor-panel" class="editor-panel" hidden>
            <div class="segmented editor-actions" role="group" aria-label="国家编辑方式">
              <button class="active" type="button" data-state-action="sample">取样</button>
              <button type="button" data-state-action="paint">涂抹</button>
            </div>
            <label class="field-row">
              <span>颜色</span>
              <input id="state-color" type="color" value="#66c2a5" />
            </label>
          </div>

          <div class="toolbar editor-toolbar">
            <button type="button" id="editor-undo">撤销</button>
            <button type="button" id="editor-reset">重置</button>
          </div>

          <dl class="stats compact editor-status" id="editor-status">
            <div>
              <dt>状态</dt>
              <dd>未编辑</dd>
            </div>
          </dl>
        </section>

        <section>
          <h2>悬停 cell</h2>
          <dl class="stats compact" id="hover-stats">
            <div>
              <dt>状态</dt>
              <dd>未选中</dd>
            </div>
          </dl>
        </section>

        <dl class="stats" id="stats"></dl>
      </aside>

      <section class="viewport">
        <canvas id="map-canvas"></canvas>
        <div id="map-overlay" class="map-overlay" aria-hidden="true"></div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
